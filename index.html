<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Head of the page -->
    <!-- An HTML comment ignored by the browser. -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link rel="icon" href="https://tomcollinsresearch.net/cma4w/assets/logos/cma4w_logo.ico" />
    <title>Hello World!</title>

    <!-- Meta tags for search engines and social media -->
    <meta
      property="og:description"
      content="A simple HTML page"
    />

    <!-- Import stylesheets. -->
    <link rel="stylesheet" href="style.css" />
    <!-- Import JavaScript files. -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Body of the page -->
    <!-- divs help arrange the page content. -->
    <div class="wrapper">
      <div class="content" role="main">
        <h1 class="title">Hello Again!</h1> <!-- Title -->
        <!-- Here's an image -->
        <img
          src="https://tomcollinsresearch.net/cma4w/assets/logo/cma4w_logo.png"
          class="illustration"
          alt="CMA4W logo"
          title="Click the image!"
        />
        <p id="myParagraph">
          This is some text inside a paragraph tag.
        </p>
      </div>
    </div>
    <!-- The footer provides a bit of space at the bottom of the page,
    and could contain aa few credits, links, etc. ✂ -->
    <footer class="footer">
      <div class="links"></div>
    </footer>
  </body>
</html>
